[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confidential-ml-feature-store"
version = "0.1.0"
description = "Confidential ML feature store with hardware-isolated inference using AWS Nitro Enclaves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Confidential ML Feature Store contributors" }
]
keywords = [
  "aws",
  "nitro-enclaves",
  "fastapi",
  "feature-store",
  "confidential-computing",
  "mlops"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.42.0",
  "boto3==1.42.69",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "scikit-learn==1.8.0",
  "joblib==1.5.3"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "moto==5.1.22",
  "httpx==0.28.1",
  "ruff==0.15.6",
  "mypy==1.19.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["feature_store*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["feature_store", "enclave", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["feature_store"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
  "^build/",
  "^dist/"
]
